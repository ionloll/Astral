name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Native Release (x64)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile Astral (Release x64)
        run: |
          msbuild Astral.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Stage Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item "bin\Release\Astral.exe" -Destination "dist\"
          Copy-Item "Launch.bat" -Destination "dist\"
          Copy-Item "LICENSE" -Destination "dist\"
          Copy-Item "README.md" -Destination "dist\"
          
          Compress-Archive -Path "dist\*" -DestinationPath "Astral-Release-x64.zip" -Force

      - name: Compute Cryptographic Hashes (SHA-256)
        id: hashes
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash -Path "dist\Astral.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -Path "Astral-Release-x64.zip" -Algorithm SHA256).Hash
          
          Write-Output "EXE_SHA256=$exeHash" >> $env:GITHUB_ENV
          Write-Output "ZIP_SHA256=$zipHash" >> $env:GITHUB_ENV
          
          Write-Host "Astral.exe SHA-256: $exeHash"
          Write-Host "Astral-Release-x64.zip SHA-256: $zipHash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Astral.exe
            Astral-Release-x64.zip
          name: Astral ${{ github.ref_name }}
          body: |
            ## Automated Clean Build Verification

            This binary release was built directly from open-source code on an isolated Microsoft GitHub Actions runner (`windows-latest`).

            ### Cryptographic Checksums (SHA-256)
            - **`Astral.exe`**:
              `${{ env.EXE_SHA256 }}`
            - **`Astral-Release-x64.zip`**:
              `${{ env.ZIP_SHA256 }}`

            ### Verification in PowerShell:
            ```powershell
            Get-FileHash .\Astral.exe -Algorithm SHA256
            ```

            *Built from commit ${{ github.sha }} | Developed & Maintained by @ionj*
